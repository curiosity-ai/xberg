[package]
name = "xberg-paddle-ocr"
version.workspace = true
edition = "2024"
rust-version.workspace = true
authors.workspace = true
description = "PaddleOCR via ONNX Runtime for Xberg - high-performance text recognition"
license = "MIT"
repository.workspace = true
homepage = "https://xberg.io"
documentation = "https://docs.rs/xberg-paddle-ocr"
readme = "README.md"
keywords = ["paddle", "ocr", "onnx", "recognition", "detection"]
categories = ["computer-vision", "text-processing"]
exclude = ["tests/*", ".github/*"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "xberg_paddle_ocr"
crate-type = ["lib"]

[features]
# No default backend: consumers pick `ort` or `tract` explicitly, and `lib.rs` fails the
# build with a `compile_error!` if neither is set. First-party crate, so there is no
# external-consumer default to preserve. ~keep
default = []
# Native ONNX Runtime backend (desktop/server; today's only path). ~keep
ort = ["dep:ort"]
# Pure-Rust ONNX backend (wasm32, and the Android x86_64 emulator where `ort` cannot link). ~keep
tract = ["dep:tract-onnx"]
# ort loading libonnxruntime at runtime via ORT_DYLIB_PATH; implies the `ort` backend. ~keep
load-dynamic = ["ort", "ort/load-dynamic"]

[dependencies]
geo-clipper = "0.9"
geo-types = "0.7"
image = { workspace = true }

# Crate-specific dependencies (not in workspace)
# Disable rayon - OCR parallelism is handled at higher level
imageproc = { version = "0.27", default-features = false }
ndarray = "0.17"
ort = { workspace = true, features = ["ndarray"], optional = true }
# Workspace dependencies
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tract-onnx = { workspace = true, optional = true }
